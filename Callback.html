<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif; font-size: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background: #fff; color: #202124;
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h2 { margin: 0 0 8px; }
    p  { color: #5f6368; margin: 4px 0; font-size: 13px; }
    .orcid { color: #a6ce39; font-weight: bold; }
  </style>
</head>
<body>
  <? if (success) { ?>
    <div class="icon">✅</div>
    <h2>Signed in successfully</h2>
    <p><span class="orcid"><?= message ?></span></p>
    <p style="margin-top:12px">You can close this window — return to Google Docs to insert your author entry.</p>
    <script>
      // Attempt to close automatically after a short delay.
      setTimeout(function() { window.close(); }, 3000);
    </script>
  <? } else { ?>
    <div class="icon">❌</div>
    <h2>Authorization failed</h2>
    <p><?= message ?></p>
    <p style="margin-top:12px;font-family:monospace;font-size:11px;word-break:break-all">redirect_uri sent: <?= debugUri ?></p>
    <p style="margin-top:12px">Close this window and try again.</p>
  <? } ?>
</body>
</html>
