<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 20px; color: #202124; }

    .step { display: none; }
    .step.active { display: block; }

    /* ── Auth step ── */
    .orcid-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .orcid-logo svg { flex-shrink: 0; }
    .orcid-logo span { font-size: 15px; font-weight: bold; color: #a6ce39; letter-spacing: .5px; }
    p.lead { color: #3c4043; line-height: 1.5; }

    .btn-orcid {
      display: inline-flex; align-items: center; gap: 10px;
      background: #a6ce39; color: #000; border: none;
      padding: 11px 22px; border-radius: 6px; cursor: pointer;
      font-size: 14px; font-weight: bold; margin: 18px 0 10px;
    }
    .btn-orcid:hover  { background: #8fb82e; }
    .btn-orcid:disabled { opacity: .5; cursor: not-allowed; }

    #status { font-size: 12px; color: #5f6368; min-height: 18px; }

    /* ── Preview step ── */
    .card {
      border: 1px solid #e8eaed; border-radius: 8px;
      padding: 14px; margin: 14px 0; background: #f8f9fa;
    }
    .author-name { font-weight: bold; font-size: 15px; }
    .author-orcid { font-size: 11px; color: #5f6368; margin-top: 2px; }
    .author-aff   { font-size: 12px; color: #3c4043; margin-top: 5px; padding-left: 10px;
                    border-left: 3px solid #dadce0; }
    .ror-badge    { font-size: 10px; color: #1a73e8; margin-left: 6px; }

    .footer {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 8px; margin-top: 16px;
    }
    button.insert { background: #1a73e8; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    button.insert:disabled { opacity: .5; cursor: not-allowed; }
    button.cancel { background: #f1f3f4; color: #202124; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #status2 { font-size: 12px; color: #5f6368; margin-right: auto; }
  </style>
</head>
<body>

  <!-- Step 1: authenticate -->
  <div id="step-auth" class="step active">
    <div class="orcid-logo">
      <svg width="28" height="28" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="36" fill="#A6CE39"/>
        <path d="M26.6 22.1h-5.1v27.8h5.1V22.1z" fill="#fff"/>
        <circle cx="24" cy="17" r="3.2" fill="#fff"/>
        <path d="M33.5 22.1h10.1c9.1 0 15.6 5.8 15.6 13.9 0 8.1-6.5 13.9-15.6 13.9H33.5V22.1zm5.1 22.9h4.7c6.1 0 10.7-3.7 10.7-9S49.4 26.9 43.3 26.9h-4.7v18.1z" fill="#fff"/>
      </svg>
      <span>ORCID</span>
    </div>
    <p class="lead">Sign in with your ORCID account. Your name, affiliation(s), and ORCID iD will be added to the document.</p>
    <button class="btn-orcid" id="btn-auth" onclick="startAuth()">
      <svg width="18" height="18" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="36" fill="#fff"/>
        <path d="M26.6 22.1h-5.1v27.8h5.1V22.1z" fill="#A6CE39"/>
        <circle cx="24" cy="17" r="3.2" fill="#A6CE39"/>
        <path d="M33.5 22.1h10.1c9.1 0 15.6 5.8 15.6 13.9 0 8.1-6.5 13.9-15.6 13.9H33.5V22.1zm5.1 22.9h4.7c6.1 0 10.7-3.7 10.7-9S49.4 26.9 43.3 26.9h-4.7v18.1z" fill="#A6CE39"/>
      </svg>
      Sign in with ORCID
    </button>
    <div id="status"></div>
  </div>

  <!-- Step 2: preview & insert -->
  <div id="step-preview" class="step">
    <p class="lead">Confirm the information to insert:</p>
    <div class="card">
      <div class="author-name"  id="preview-name"></div>
      <div class="author-orcid" id="preview-orcid"></div>
      <div id="preview-affs"></div>
    </div>
    <div class="footer">
      <span id="status2"></span>
      <button class="cancel" onclick="google.script.host.close()">Cancel</button>
      <button class="insert" id="btn-insert" onclick="doInsert()">Insert into Document</button>
    </div>
  </div>

  <script>
    var author    = null;
    var pollTimer = null;

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function startAuth() {
      document.getElementById('btn-auth').disabled = true;
      setStatus('Contacting ORCID…');
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.error) {
            setStatus('Error: ' + result.error);
            document.getElementById('btn-auth').disabled = false;
            return;
          }
          // Open the ORCID OAuth page in a popup.
          window.open(result.authUrl, 'orcid_auth',
            'width=620,height=720,menubar=no,toolbar=no,location=yes,status=no');
          setStatus('Waiting for ORCID sign-in… (complete it in the popup window)');
          pollTimer = setInterval(poll, 2500);
        })
        .withFailureHandler(function(err) {
          setStatus('Error: ' + (err && err.message));
          document.getElementById('btn-auth').disabled = false;
        })
        .startOAuth();
    }

    function poll() {
      google.script.run
        .withSuccessHandler(function(result) {
          if (!result) return;
          clearInterval(pollTimer);
          author = result;
          showPreview(author);
        })
        .withFailureHandler(function(err) {
          clearInterval(pollTimer);
          setStatus('Polling error: ' + (err && err.message));
          document.getElementById('btn-auth').disabled = false;
        })
        .pollForAuthor();
    }

    function showPreview(a) {
      document.getElementById('step-auth').classList.remove('active');
      document.getElementById('step-preview').classList.add('active');
      document.getElementById('preview-name').textContent  = a.name;
      document.getElementById('preview-orcid').textContent = 'ORCID iD: ' + a.orcid;

      var affsEl = document.getElementById('preview-affs');
      if (a.affiliations && a.affiliations.length) {
        affsEl.innerHTML = a.affiliations.map(function(aff) {
          var ror = aff.rorId
            ? '<span class="ror-badge">ROR: ' + aff.rorId + '</span>'
            : '';
          return '<div class="author-aff">' + aff.name + ror + '</div>';
        }).join('');
      } else {
        affsEl.innerHTML = '<div class="author-aff" style="color:#9aa0a6">No affiliations on public ORCID record.</div>';
      }
    }

    function doInsert() {
      if (!author) return;
      document.getElementById('btn-insert').disabled = true;
      document.getElementById('status2').textContent = 'Inserting…';
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.skipped) {
            document.getElementById('status2').textContent = result.reason;
            document.getElementById('btn-insert').disabled = false;
          } else {
            google.script.host.close();
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('status2').textContent = 'Error: ' + (err && err.message);
          document.getElementById('btn-insert').disabled = false;
        })
        .insertAuthor(author);
    }
  </script>
</body>
</html>
